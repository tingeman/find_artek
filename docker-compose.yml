# Base Docker Compose file (development only)
# Defines the abstract services and their relationships; docker-compose.develop.yml and
# .devcontainer/docker-compose.yml add the details. Production does not use these files: it runs
# dtu_sus_web_server's docker/compose_find_artek.yml with the release image.

services:
  webapp-find-artek:
    restart: always
    build:
      context: .
      # Dockerfile and build target are specified in the override file
    # env_file is specified in override files to use correct .env file
    volumes:
      # Abstract volumes for static and media files (bind mounts defined in the override file).
      - staticfiles_data:/mnt/shared-project-data/staticfiles:rw
      - media_data:/mnt/shared-project-data/media:rw
    networks:
      - docker_default
    stdin_open: true
    tty: true

  find-artek-mariadb-service:
    restart: always
    image: mariadb:11.2
    # env_file is specified in override files to use correct .env file
    volumes:
      - find-artek-mariadb-data:/var/lib/mysql
      - ./docker/mariadb-service/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - docker_default

  find-artek-phpmyadmin-service:
    restart: always
    image: phpmyadmin/phpmyadmin:latest
    # Port is published in the override file (127.0.0.1 only)
    # env_file is specified in override files to use correct .env file
    environment:
      PMA_HOST: find-artek-mariadb-service
    volumes:
      - ./docker/phpmyadmin-service/phpmyadmin-misc.ini:/usr/local/etc/php/conf.d/phpmyadmin-misc.ini
    networks:
      - docker_default

volumes:
  staticfiles_data:
    # Driver and options are defined in override files
  media_data:
    # Driver and options are defined in override files
  find-artek-mariadb-data:
    # External in the override file (the dev database volume)

networks:
  docker_default:
    # Managed by Docker Compose
