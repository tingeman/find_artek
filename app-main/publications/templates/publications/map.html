{% extends base_template %}

<!-- i18n and static are Django template tags. They are used to load the i18n and static template tags. The i18n template tag is used to mark strings for translation. -->
<!-- The static is a template tag that is used to load the static template tag library. This library provides a way to reference static files, such as CSS, JavaScript, or image files, which are not tied to a particular instance of a model in your Django app. -->
{% load i18n static static_version %}

{# title #}
{% block title %}Front page{% endblock %}

{% block dynamic_head_content %}
    <link rel="stylesheet" href="{% static 'publications/vendor/leaflet-1.9.4/leaflet.css' %}" />
    <link rel="stylesheet" type="text/css" media="all" href="{% static 'publications/css/map.css' %}" />
    <script src="{% static 'publications/vendor/leaflet-1.9.4/leaflet.js' %}" defer></script>
    <script src="{% static 'publications/vendor/proj4-2.22.0/proj4.js' %}" defer></script>
    <script src="{% static 'publications/vendor/proj4leaflet-1.0.2/proj4leaflet.js' %}" defer></script>
    <script src="{% versioned_static 'publications/js/map/find-artek-map-layers.js' %}" defer></script>
    <script src="{% versioned_static 'publications/js/map/find-artek-map.js' %}" defer></script>
    <script src="{% versioned_static 'publications/js/map.js' %}" defer></script>
{% endblock %}

<!-- headline for the page -->
{% block headline %}Map{% endblock %}

{% block main-content %}

<div class="map-container">
    <div class="map" id="map"{% if FA_DATAFORSYNINGEN_TOKEN %} data-dataforsyningen-token="{{ FA_DATAFORSYNINGEN_TOKEN }}"{% endif %} data-map-mode="overview"></div>
    
    <div id="loading-overlay">
        <div id="loading-icon"></div>
    </div>
</div>


{% endblock %}
