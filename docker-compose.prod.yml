# Production override file
# Provides production-specific configurations for the CIFS network drive

services:
  webapp-find-artek:
    container_name: webapp-find-artek
    build:
      dockerfile: Dockerfile.prod
    env_file:
      - .prod.env  # Production environment variables
    environment:
      MYSQL_HOST: find-artek-mariadb-service
      ENABLE_CRON: ${ENABLE_CRON:-true}
      THUMBNAIL_HEIGHT: ${THUMBNAIL_HEIGHT:-400}
    ports:
      - "8099:8099"

  find-artek-mariadb-service:
    container_name: fa-mariadb-service
    env_file:
      - .prod.env

  find-artek-phpmyadmin-service:
    container_name: fa-phpmyadmin-service
    env_file:
      - .prod.env
    ports:
      - "6001:80"

volumes:
  staticfiles_data:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NETWORK_DRIVE_USER},password=${NETWORK_DRIVE_PASSWORD},ro"
      device: "//${NETWORK_DRIVE_HOST}/${NETWORK_DRIVE_SHARE}/staticfiles"
  media_data:
    driver: local
    driver_opts:
      type: cifs
      o: "username=${NETWORK_DRIVE_USER},password=${NETWORK_DRIVE_PASSWORD},uid=30000,gid=30000,dir_mode=0755,file_mode=0644"
      device: "//${NETWORK_DRIVE_HOST}/${NETWORK_DRIVE_SHARE}/media"
  find-artek-mariadb-data:
    name: find-artek-mariadb-prod


networks:
  docker_default:
    external: true